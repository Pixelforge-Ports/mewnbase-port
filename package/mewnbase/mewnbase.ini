[config]
deadzone_mode = scaled_radial
deadzone = 2000
deadzone_triggers = 3000
deadzone_scale = 6
mouse_delay = 16
mouse_slow_scale = 40
dpad_mouse_normalize = true

[controls]
overlay = clear
mouse_wheel_amount = 1
a = mouse_left
b = mouse_right
x = tab
y = m
start = esc
back = hold_state hotkey
l1 = mouse_slow
r1 = r
l2 = enter
r2 = space
dpad = mouse_movement
left_analog_up = w
left_analog_down = s
left_analog_left = a
left_analog_right = d
right_analog = mouse_movement

[controls:hotkey]
overlay = parent
dpad = arrow_keys
left =
right =
y = w
a = s
x = a
b = d
l1 = push_state text_input
r1 = f
l2 = q
r2 = q add_shift
up = mouse_wheel_up repeat
down = mouse_wheel_down repeat

[controls:text_input]
overlay = clear
charset = full
up = prev_letter
down = next_letter
right = add_letter
left = remove_letter
a = add_letter
b = remove_letter
start = finish_text
back = cancel_text
